<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App - Quiz</title>
  <link rel="stylesheet" href="../styles/Main.css">
</head>

<body>
  <div class="container">
    <button id="dark-mode-toggle" type="button"></button>
    <a href="Options.html" class="btn-text" data-i18n="options">Options</a>
    <div id="quiz-screen">
      <div class="top-bar">
        <a href="Index.html" class="btn-text" data-i18n="home">Home</a>
        <button type="button" class="btn-text" id="logout-btn" data-i18n="logout">Logout</button>
      </div>

      <div class="header">
        <div class="lives-row" id="lives"></div>
        <div><span data-i18n="question">Question</span> <strong id="current">1</strong>/10</div>
      </div>

      <div class="question" id="question-text">Loading...</div>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>

      <button type="button" class="btn-main" id="submit-btn" disabled data-i18n="submitAnswer">Submit Answer</button>
      <button type="button" class="btn-main" id="next-btn" style="display:none;" data-i18n="nextQuestion">Next
        Question</button>
    </div>

    <div id="result-screen">
      <h1 data-i18n="quizFinished">Quiz Finished</h1>
      <div class="stat"><span data-i18n="correctAnswers">Correct answers:</span> <strong id="correct-count">0</strong>
      </div>
      <div class="stat"><span data-i18n="remainingLives">Remaining lives:</span> <span id="remaining-lives"></span>
      </div>
      <div class="stat"><span data-i18n="totalScore">Total score:</span> <strong id="total-score">0</strong></div>
      <button type="button" class="btn-main" id="play-again-btn" style="margin-top: 24px;" data-i18n="playAgain">Play
        Again</button>
      <a href="Leaderboard.html" class="btn-secondary" data-i18n="viewLeaderboard">View Leaderboard</a>
      <a href="Index.html" class="btn-secondary" data-i18n="backHome">Back to Home</a>
    </div>
  </div>

  <script src="../js/App.js"></script>
  <script>
    requireLogin();
    document.getElementById("logout-btn").addEventListener("click", logout);

    var lives = 3;
    var currentIndex = 0;
    var correctAnswers = 0;
    var questions = [];
    var selected = [];
    var answered = false;

    function hearts(n) {
      var html = "";
      for (var i = 0; i < 3; i++) {
        if (i < n) {
          html += '<img src="heart.svg" alt="life" class="life-heart">';
        } else {
          html += '<img src="heart-empty.svg" alt="lost" class="life-heart">';
        }
      }
      return html;
    }

    function updateLives() {
      document.getElementById("lives").innerHTML = hearts(lives);
    }

    async function startQuiz() {
      lives = 3;
      currentIndex = 0;
      correctAnswers = 0;
      selected = [];
      answered = false;

      questions = await getQuestionsFromMyDatabase();

      document.getElementById("quiz-screen").style.display = "block";
      document.getElementById("result-screen").style.display = "none";
      updateLives();

      showQuestion();
    }

    function showQuestion() {
      var q = questions[currentIndex];
      document.getElementById("question-text").textContent = q.text;
      document.getElementById("current").textContent = currentIndex + 1;

      var optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      q.options.forEach(function (opt, i) {
        var div = document.createElement("div");
        div.className = "option";
        div.textContent = opt;
        div.onclick = function () {
          toggleOption(div, i);
        };
        optionsDiv.appendChild(div);
      });

      document.getElementById("feedback").style.display = "none";
      document.getElementById("submit-btn").style.display = "block";
      document.getElementById("submit-btn").disabled = true;
      document.getElementById("next-btn").style.display = "none";
      selected = [];
      answered = false;
    }

    function toggleOption(element, index) {
      if (answered) return;

      if (selected.indexOf(index) !== -1) {
        selected = selected.filter(function (i) {
          return i !== index;
        });
        element.classList.remove("selected");
      } else {
        selected.push(index);
        element.classList.add("selected");
      }

      document.getElementById("submit-btn").disabled = selected.length === 0;
    }

    document.getElementById("submit-btn").onclick = function () {
      if (selected.length === 0 || answered) return;
      answered = true;

      var q = questions[currentIndex];
      var options = document.querySelectorAll(".option");
      var feedback = document.getElementById("feedback");

      var selectedSorted = selected.slice().sort(function (a, b) {
        return a - b;
      });
      var correctSorted = q.correct.slice().sort(function (a, b) {
        return a - b;
      });
      var isCorrect = JSON.stringify(selectedSorted) === JSON.stringify(correctSorted);

      options.forEach(function (opt, i) {
        if (q.correct.indexOf(i) !== -1) {
          opt.classList.add("correct");
        } else if (selected.indexOf(i) !== -1) {
          opt.classList.add("wrong");
        }
      });

      if (isCorrect) {
        feedback.textContent = t("correct");
        feedback.className = "feedback correct";
        correctAnswers++;
      } else {
        feedback.textContent = t("wrong");
        feedback.className = "feedback wrong";
        lives = lives - 1;
        updateLives();
      }

      document.getElementById("submit-btn").style.display = "none";
      document.getElementById("next-btn").style.display = "block";

      if (lives <= 0 || currentIndex === 9) {
        document.getElementById("next-btn").textContent = t("seeResults");
      } else {
        document.getElementById("next-btn").textContent = t("nextQuestion");
      }
    };

    document.getElementById("next-btn").onclick = async function () {
      if (lives <= 0 || currentIndex === 9) {
        var finalScore = correctAnswers * 10;
        await saveScoreToDatabase(getCurrentUser(), finalScore);
        showResults(finalScore);
      } else {
        currentIndex++;
        showQuestion();
      }
    };

    function showResults(finalScore) {
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";
      document.getElementById("correct-count").textContent = correctAnswers;
      document.getElementById("remaining-lives").innerHTML = hearts(lives);
      document.getElementById("total-score").textContent = finalScore;
    }

    function updateQuizLanguage() {
      var submitBtn = document.getElementById("submit-btn");
      var nextBtn = document.getElementById("next-btn");

      if (submitBtn && submitBtn.style.display !== "none") {
        submitBtn.textContent = t("submitAnswer");
      }

      if (nextBtn && nextBtn.style.display !== "none") {
        nextBtn.textContent = (lives <= 0 || currentIndex === 9)
          ? t("seeResults")
          : t("nextQuestion");
      }
    }

    document.getElementById("play-again-btn").onclick = startQuiz;

    setupSiteSettings();
    startQuiz();
  </script>
</body>

</html>
