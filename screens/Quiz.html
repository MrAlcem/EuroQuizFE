<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euro Quiz - Quiz</title>
  <link rel="stylesheet" href="../styles/Main.css">
  <link rel="stylesheet" href="../styles/Quiz.css">
</head>

<body>
  <div class="container">
    <button id="dark-mode-toggle" type="button"></button>
    <select id="language-select" class="lang-select">
      <option value="en" data-i18n="english">English</option>
      <option value="hr" data-i18n="croatian">Croatian</option>
      <option value="se" data-i18n="swedish">Swedish</option>
      <option value="nl" data-i18n="dutch">Dutch</option>
    </select>
    <div id="quiz-screen">
      <div class="top-bar">
        <a href="../screens/home.html" class="btn-home">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M12 3.2 3 10.6V21h6v-6h6v6h6V10.6L12 3.2z"/>
          </svg>
          <span data-i18n="home">Home</span>
        </a>
      </div>

      <div class="header">
        <div><span data-i18n="question">Question</span> <strong id="current">1</strong>/<span id="total">10</span></div>
        <div id="lives-display" class="lives-display"></div>
        <div><span data-i18n="time">Time</span>: <strong id="question-timer">30</strong>s</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <p id="quiz-level" class="quiz-level"></p>

      <div class="question" id="question-text" data-i18n="loading">Loading...</div>
      <div id="options"></div>
      <div class="error-inline" id="quiz-error" style="display:none;"></div>
      <a href="../screens/FindYourQuiz.html" class="btn-main" id="choose-another-quiz-btn" style="display:none;" data-i18n="chooseAnotherQuiz">Choose another quiz</a>

      <button type="button" class="btn-main quiz-action-btn" id="submit-btn" disabled data-i18n="submitAnswer">Submit Answer</button>
      <button type="button" class="btn-main quiz-action-btn" id="next-btn" style="display:none;" data-i18n="nextQuestion">Next
        Question</button>
    </div>

    <div id="result-screen">
      <h1 data-i18n="quizFinished">Quiz Finished</h1>
      <div class="result-stats">
        <div class="stat"><span data-i18n="correctAnswers">Correct answers:</span> <strong id="correct-count">0</strong>
        </div>
        <div class="stat" id="remaining-lives-stat"><span data-i18n="remainingLives">Remaining lives:</span> <span id="remaining-lives"></span>
        </div>
        <div class="stat"><span data-i18n="totalScore">Total score:</span> <strong id="total-score">0</strong></div>
      </div>
      <p id="daily-reset-note" class="error-inline" style="display:none;"></p>
      <button type="button" class="btn-main themed" id="play-again-btn" style="margin-top: 24px;" data-i18n="playAgain">Play
        Again</button>
      <a href="../screens/Leaderboard.html" class="btn-secondary" data-i18n="viewLeaderboard">View Leaderboard</a>
      <a href="../screens/home.html" class="btn-secondary" data-i18n="backHome">Back to Home</a>
    </div>
  </div>


  <!-- Core -->
  <script src="../js/session.js"></script>

  <!-- API layer -->
  <script src="../js/api/auth.js"></script>
  <script src="../js/api/quiz.js"></script>
  <script src="../js/api/leaderboard.js"></script>
  <script src="../js/api/profile.js"></script>

  <!-- UI helpers -->
  <script src="../js/i18n.js"></script>
  <script src="../js/dark-mode.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/setup.js"></script>
  <script>
    requireLogin();

    var currentIndex = 0;
    var questions = [];
    var selectedOption = null;
    var sessionId = null;
    var timerId = null;
    var timeRemaining = 30;
    var pendingResult = null;
    var quizParams = new URLSearchParams(window.location.search);
    var isDaily = quizParams.get("daily") === "1";
    var quizCategory = quizParams.get("category") || null;
    var quizCountry = quizParams.get("country") || null;
    var dailyResetsAtIso = null;

    function hearts(n) {
      var html = "";
      for (var i = 0; i < 3; i++) {
        if (i < n) {
          html += '<img src="heart.svg" alt="life" class="life-heart">';
        } else {
          html += '<img src="heart-empty.svg" alt="lost" class="life-heart">';
        }
      }
      return html;
    }

    async function startQuiz() {
      currentIndex = 0;
      selectedOption = null;
      sessionId = null;
      pendingResult = null;
      stopTimer();

      document.getElementById("quiz-screen").style.display = "block";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("quiz-error").style.display = "none";
      document.getElementById("play-again-btn").style.display = "";
      document.getElementById("daily-reset-note").style.display = "none";
      document.getElementById("choose-another-quiz-btn").style.display = "none";
      dailyResetsAtIso = null;

      try {
        var session = await fetchQuizSession(isDaily, quizCategory, quizCountry);

        if (isDaily && session.already_completed) {
          showResults(session.completed_result);
          setDailyChallengeResetsAt(session.resets_at);
          showDailyResetNote(session.resets_at);
          return;
        }

        questions = session.data;
        sessionId = session.session_id;
        timeRemaining = session.timer_seconds;
        document.getElementById("quiz-level").textContent =
          session.gamification.level + " · " + (isDaily ? "Daily Challenge" : "Standard Quiz");

        var livesDisplay = document.getElementById("lives-display");
        if (isDaily) {
          livesDisplay.style.display = "none";
        } else {
          livesDisplay.innerHTML =
            hearts(typeof session.lives_remaining === "number" ? session.lives_remaining : 3);
        }
      } catch (err) {
        document.getElementById("question-text").textContent = "";
        document.getElementById("options").innerHTML = "";
        document.getElementById("submit-btn").style.display = "none";
        var error = document.getElementById("quiz-error");
        error.textContent = err.message || "Failed to load questions";
        error.style.display = "block";
        if (!isDaily && (quizCategory || quizCountry)) {
          document.getElementById("choose-another-quiz-btn").style.display = "block";
        }
        return;
      }

      document.getElementById("total").textContent = questions.length;
      showQuestion();
    }

    function showQuestion() {
      var q = questions[currentIndex];
      console.log(currentIndex);
      document.getElementById("question-text").textContent = q.text;
      document.getElementById("current").textContent = currentIndex + 1;

      var optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      ["A", "B", "C", "D"].forEach(function (key) {
        var div = document.createElement("div");
        div.className = "option";
        div.dataset.option = key;

        var letter = document.createElement("span");
        letter.className = "option-letter";
        letter.textContent = key;

        var text = document.createElement("span");
        text.className = "option-text";
        text.textContent = q.options[key];

        div.appendChild(letter);
        div.appendChild(text);
        div.onclick = function () {
          selectOption(div, key);
        };
        optionsDiv.appendChild(div);
      });

      var progressFill = document.getElementById("progress-fill");
      progressFill.style.width = ((currentIndex + 1) / questions.length * 100) + "%";

      document.getElementById("submit-btn").style.display = "block";
      document.getElementById("submit-btn").disabled = true;
      document.getElementById("next-btn").style.display = "none";
      selectedOption = null;
      startTimer(q.time_limit_seconds || timeRemaining);
    }

    // Re-renders the currently loaded question(s)' text in place, without
    // touching the timer or the selected/answered state — used after a
    // language switch mid-quiz, when the timer must keep running untouched.
    function updateQuestionText() {
      var q = questions[currentIndex];
      if (!q) return;

      document.getElementById("question-text").textContent = q.text;
      document.querySelectorAll("#options .option").forEach(function (optionEl) {
        var textEl = optionEl.querySelector(".option-text");
        if (textEl) textEl.textContent = q.options[optionEl.dataset.option];
      });
    }

    async function retranslateQuestions() {
      if (!sessionId || !questions.length) return;
      try {
        var translated = await fetchSessionQuestions(sessionId);
        questions = translated.data;
        updateQuestionText();
      } catch (err) {
        // Keep showing the questions in whatever language they're already in.
      }
    }

    function selectOption(element, key) {
      document.querySelectorAll(".option").forEach(function (opt) {
        opt.classList.remove("selected");
      });
      element.classList.add("selected");
      selectedOption = key;
      document.getElementById("submit-btn").disabled = false;
    }

    async function submitAnswer(chosenOption, timedOut) {
      document.getElementById("submit-btn").style.display = "none";
      stopTimer();

      try {
        var answer = await answerQuizQuestion(sessionId, chosenOption);

        if (!isDaily) {
          document.getElementById("lives-display").innerHTML = hearts(answer.lives_remaining);
        }

        document.querySelectorAll(".option").forEach(function (option) {
          option.onclick = null;
          if (option.dataset.option === answer.correct_option) {
            option.classList.add("correct");
          }
          if (option.dataset.option === chosenOption && !answer.correct) {
            option.classList.add("wrong");
          }
        });

        pendingResult = answer.finished ? answer.result : null;
        if (!answer.finished) questions[currentIndex + 1] = answer.next_question;
        document.getElementById("next-btn").style.display = "block";
        document.getElementById("next-btn").textContent =
          answer.finished ? t("seeResults") : t("nextQuestion");

        // Time ran out with no answer chosen: don't wait on the player to
        // click "Next Question" — briefly show the correct answer, then move
        // on automatically.
        if (timedOut) {
          setTimeout(function () {
            document.getElementById("next-btn").click();
          }, 1500);
        }
      } catch (err) {
        var submitError = document.getElementById("quiz-error");
        submitError.textContent = err.message;
        submitError.style.display = "block";
        document.getElementById("submit-btn").style.display = "block";
      }
    }

    document.getElementById("submit-btn").onclick = function () {
      if (!selectedOption) return;
      submitAnswer(selectedOption);
    };

    document.getElementById("next-btn").onclick = async function () {
      if (pendingResult) {
        showResults(pendingResult);
        if (isDaily) {
          var resetsAt = nextDailyResetIso();
          setDailyChallengeResetsAt(resetsAt);
          showDailyResetNote(resetsAt);
        }
        pendingResult = null;
        return;
      }
      currentIndex++;
      showQuestion();
    };

    function startTimer(seconds) {
      stopTimer();
      timeRemaining = seconds;
      document.getElementById("question-timer").textContent = timeRemaining;
      timerId = setInterval(function () {
        timeRemaining--;
        document.getElementById("question-timer").textContent = Math.max(timeRemaining, 0);
        if (timeRemaining <= 0) {
          stopTimer();
          // No answer chosen in time; the server independently re-checks
          // the timeout too, so this is just an honest "no answer" signal.
          submitAnswer(null, true);
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function showResults(result) {
      stopTimer();
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";
      document.getElementById("correct-count").textContent = result.correct_answers;
      document.getElementById("total-score").textContent = result.score;

      var livesStat = document.getElementById("remaining-lives-stat");
      if (isDaily) {
        livesStat.style.display = "none";
      } else {
        livesStat.style.display = "";
        document.getElementById("remaining-lives").innerHTML = hearts(result.lives_remaining);
      }
    }

    function showDailyResetNote(resetsAtIso) {
      dailyResetsAtIso = resetsAtIso;
      document.getElementById("play-again-btn").style.display = "none";
      var note = document.getElementById("daily-reset-note");
      note.textContent = t("dailyAlreadyPlayed") + " " + t("dailyResetsAt") + " " +
        new Date(resetsAtIso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      note.style.display = "block";
    }

    function updateQuizLanguage() {
      var submitBtn = document.getElementById("submit-btn");
      var nextBtn = document.getElementById("next-btn");

      if (submitBtn && submitBtn.style.display !== "none") {
        submitBtn.textContent = t("submitAnswer");
      }

      if (nextBtn && nextBtn.style.display !== "none") {
        nextBtn.textContent =
          currentIndex === questions.length - 1 ? t("seeResults") : t("nextQuestion");
      }

      if (dailyResetsAtIso) {
        showDailyResetNote(dailyResetsAtIso);
      }

      if (document.getElementById("quiz-screen").style.display !== "none") {
        retranslateQuestions();
      }
    }

    document.getElementById("play-again-btn").onclick = startQuiz;

    setupSiteSettings();
    startQuiz();
  </script>
</body>

</html>
