<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../styles/login-register.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="logo">
            <div class="logo-icon">EQ</div>
            <div class="logo-text">EuroQuiz</div>
        </div>

        <div class="auth-card">
            <h1>Register</h1>
            <p class="subtitle">Create an account to join the leaderboard.</p>

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="name">Username</label>
                    <input type="text" id="name" name="name" placeholder="quizgoat123" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.nl" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="**********" required>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <p class="switch">Already have an account? <a href="login.html">Log in here</a></p>
        </div>
    </div>

</body>
</html>
