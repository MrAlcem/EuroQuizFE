<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
    <form action="/register" method="POST">
        <h1>Register</h1>
        <label for="name">Username:</label>
        <input type="text" id="name" name="name" placeholder="quizgoat123" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.nl" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="**********" required><br><br>
        <button type="submit">Register</button>

    <p class="switch">Already have an account? <a href="login.html">Log in here</a></p>
</body>
</html>
