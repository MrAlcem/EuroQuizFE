<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>

    <h1>Login</h1>
    <form action="/login" method="POST">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.nl" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="**********" required><br><br>
        <button type="submit">Log in and start the quiz</button>

        <p class="switch">Dont have an account yet? <a href="register.html">Register here</a></p>
        
    </form>
  </section>
 
</body>
</html>
