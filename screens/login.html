<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register</title>
    <link rel="stylesheet" href="../styles/Main.css">
</head>

<body>
    <div class="container">
        <button id="dark-mode-toggle" type="button"></button>
        <a href="Options.html" class="btn-text" data-i18n="options">Options</a>

        <h1 id="page-title">Welcome</h1>
        <p class="subtitle" id="page-subtitle">Login to play the quiz</p>

        <div class="error" id="error-message" style="display: none;"></div>

        <form id="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>

            <!-- Email field – only shown in Register mode -->
            <div class="form-group" id="email-group" style="display: none;">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-main" id="auth-btn">Login</button>
        </form>

        <div class="register-link">
            <span id="toggle-text">Don't have an account?</span>
            <a href="#" id="toggle-mode">Register</a>
        </div>
    </div>

    <!-- Core -->
    <script src="../js/session.js"></script>

    <!-- API layer -->
    <script src="../js/api/auth.js"></script>
    <script src="../js/api/quiz.js"></script>
    <script src="../js/api/leaderboard.js"></script>
    <script src="../js/api/profile.js"></script>

    <!-- UI helpers -->
    <script src="../js/i18n.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/setup.js"></script>

    <script>
        // Already logged in? → go to home
        redirectIfLoggedIn();
        setupSiteSettings();

        // ---------- Toggle Login / Register ----------
        let isRegisterMode = false;

        const form = document.getElementById("auth-form");
        const errorBox = document.getElementById("error-message");
        const authBtn = document.getElementById("auth-btn");
        const toggleMode = document.getElementById("toggle-mode");
        const toggleText = document.getElementById("toggle-text");
        const pageTitle = document.getElementById("page-title");
        const pageSubtitle = document.getElementById("page-subtitle");
        const emailGroup = document.getElementById("email-group");
        const emailInput = document.getElementById("email");

        toggleMode.addEventListener("click", function (e) {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            errorBox.style.display = "none";

            if (isRegisterMode) {
                pageTitle.textContent = "Create Account";
                pageSubtitle.textContent = "Register to play the quiz";
                authBtn.textContent = "Register";
                toggleText.textContent = "Already have an account?";
                toggleMode.textContent = "Login";
                emailGroup.style.display = "block";
                emailInput.required = true;
            } else {
                pageTitle.textContent = "Welcome";
                pageSubtitle.textContent = "Login to play the quiz";
                authBtn.textContent = "Login";
                toggleText.textContent = "Don't have an account?";
                toggleMode.textContent = "Register";
                emailGroup.style.display = "none";
                emailInput.required = false;
            }
        });

        // ---------- Form submit ----------
        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            errorBox.style.display = "none";
            authBtn.disabled = true;
            authBtn.textContent = isRegisterMode ? "Creating account..." : "Logging in...";

            try {
                let result;

                if (isRegisterMode) {
                    result = await registerUser(username, email, password);
                } else {
                    result = await loginUser(username, password);
                }

                if (result.success) {
                    // Use the proper session helper
                    saveSession(result);
                    window.location.href = "Index.html";   // or home.html – change if needed
                } else {
                    errorBox.textContent = result.message || "Something went wrong";
                    errorBox.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                errorBox.textContent = "Server error. Try again later.";
                errorBox.style.display = "block";
            }

            authBtn.disabled = false;
            authBtn.textContent = isRegisterMode ? "Register" : "Login";
        });
    </script>
</body>

</html>
