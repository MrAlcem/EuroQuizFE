<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/login-register.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="logo">
            <div class="logo-icon">EQ</div>
            <div class="logo-text">EuroQuiz</div>
        </div>

        <div class="auth-card">
            <h1>Log in</h1>
            <p class="subtitle">Welcome back — log in to start your quiz.</p>

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.nl" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="**********" required>
                </div>

                <button type="submit" class="btn-primary">Log in and start the quiz</button>
            </form>

            <p class="switch">Dont have an account yet? <a href="register.html">Register here</a></p>
        </div>
    </div>

</body>
</html>
