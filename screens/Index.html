<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../styles/Main.css">
    <link rel="stylesheet" href="../styles/Index.css">
</head>

<body>

    <div class="container">
        <button id="dark-mode-toggle" type="button"></button>

        <div class="top-bar">
            <div class="user-chip">
                <span class="user-label" data-i18n="signedInAs">Signed in as</span>
                <strong id="username-display">...</strong>
            </div>
            <button type="button" class="btn-text" id="logout-btn" data-i18n="logout">Logout</button>
        </div>

        <h1 data-i18n="quizChallenge">Quiz Challenge</h1>
        <p class="subtitle" data-i18n="chooseWhat">Choose what you want to do</p>

        <div class="quiz-filters">
            <label for="quiz-category-select">Category</label>
            <select id="quiz-category-select">
                <option value="">Any category</option>
                <option value="Geography">Geography</option>
                <option value="Nature">Nature</option>
                <option value="History">History</option>
                <option value="Culture">Culture</option>
            </select>
            <label for="quiz-country-select">Country</label>
            <select id="quiz-country-select">
                <option value="">Any country</option>
                <option value="NL">Netherlands</option>
                <option value="HR">Croatia</option>
            </select>
        </div>

        <div class="menu-actions">
            <a href="../screens/Quiz.html" id="start-quiz-link" class="menu-card">
                <span class="menu-title" data-i18n="startQuiz">Start Quiz</span>
                <span class="menu-desc" data-i18n="quizDescription">10 questions · 3 lives</span>
            </a>
            <a href="../screens/Quiz.html?daily=1" class="menu-card">
                <span class="menu-title">Daily Challenge</span>
                <span class="menu-desc">One challenge per day · earn XP</span>
            </a>
            <a href="../screens/Leaderboard.html" class="menu-card secondary">
                <span class="menu-title" data-i18n="leaderboard">Leaderboard</span>
                <span class="menu-desc" data-i18n="leaderboardDescription">See top players by score</span>
            </a>
            <a href="../screens/Profile.html" class="menu-card secondary">
                <span class="menu-title" data-i18n="myProfile">My Profile</span>
                <span class="menu-desc" data-i18n="profileDescription">Personal score and quiz history</span>
            </a>
            <a href="../screens/Options.html" class="menu-card secondary">
                <span class="menu-title" data-i18n="options">Options</span>
            </a>
        </div>
    </div>

    <!-- Core -->
    <script src="../js/session.js"></script>

    <!-- API layer -->
    <script src="../js/api/auth.js"></script>
    <script src="../js/api/quiz.js"></script>
    <script src="../js/api/leaderboard.js"></script>
    <script src="../js/api/profile.js"></script>

    <!-- UI helpers -->
    <script src="../js/i18n.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/setup.js"></script>
    <script>
        requireLogin();
        document.getElementById("username-display").textContent = getCurrentUser();
        document.getElementById("logout-btn").addEventListener("click", logout);
        setupSiteSettings();

        function updateStartQuizLink() {
            var category = document.getElementById("quiz-category-select").value;
            var country = document.getElementById("quiz-country-select").value;
            var params = new URLSearchParams();
            if (category) params.set("category", category);
            if (country) params.set("country", country);
            var query = params.toString();
            document.getElementById("start-quiz-link").href =
                "../screens/Quiz.html" + (query ? "?" + query : "");
        }

        document.getElementById("quiz-category-select").addEventListener("change", updateStartQuizLink);
        document.getElementById("quiz-country-select").addEventListener("change", updateStartQuizLink);
    </script>
</body>

</html>
